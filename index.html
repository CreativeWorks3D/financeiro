<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CW3D · Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#F5F2FA; --surface:#FFFFFF; --surface-2:#FBF9FE; --ink:#2B2740; --ink-soft:#726C8C;
  --border:#E4DEF2; --brand:#8B7FD9; --brand-ink:#FFFFFF; --brand-soft:#EFEBFC;
  --cost:#DD8C7A; --cost-soft:#FBEAE4; --revenue:#5FA98A; --revenue-soft:#E6F4EE;
  --profit-pos:#4E9B77; --profit-neg:#D2645B; --etsy:#E8A25C; --etsy-soft:#FBEEDE;
  --info:#6FA3C0; --info-soft:#E9F3F8; --shadow:0 1px 2px rgba(43,39,64,.06), 0 6px 20px rgba(43,39,64,.06);
  --radius:16px; --radius-sm:10px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1A28; --surface:#26223550; --surface:#262233; --surface-2:#2E2A3E; --ink:#EDEAF6; --ink-soft:#A79FC2;
    --border:#3B3652; --brand:#A79AF0; --brand-ink:#1D1A28; --brand-soft:#332E4C;
    --cost:#E39C89; --cost-soft:#3A2A2C; --revenue:#7DC4A4; --revenue-soft:#20362E;
    --profit-pos:#7DC4A4; --profit-neg:#E68C82; --etsy:#EEB47B; --etsy-soft:#3A2E1F;
    --info:#8FC2DE; --info-soft:#20313A; --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#1D1A28; --surface:#262233; --surface-2:#2E2A3E; --ink:#EDEAF6; --ink-soft:#A79FC2;
  --border:#3B3652; --brand:#A79AF0; --brand-ink:#1D1A28; --brand-soft:#332E4C;
  --cost:#E39C89; --cost-soft:#3A2A2C; --revenue:#7DC4A4; --revenue-soft:#20362E;
  --profit-pos:#7DC4A4; --profit-neg:#E68C82; --etsy:#EEB47B; --etsy-soft:#3A2E1F;
  --info:#8FC2DE; --info-soft:#20313A; --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.35);
}
html,body{height:100%;}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
h1,h2,h3,.display{font-family:'Fraunces',serif; letter-spacing:-0.01em;}
.tabular{font-variant-numeric:tabular-nums;}
button{font-family:inherit; cursor:pointer;}
input,select{font-family:inherit; font-size:15px;}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

#app{max-width:640px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}

/* header */
.topbar{position:sticky; top:0; z-index:20; background:var(--bg); padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0;}
.brand-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--info));display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fraunces',serif;font-weight:700;font-size:16px;flex-shrink:0;}
.brand-text h1{font-size:17px;margin:0;line-height:1.1;font-weight:600;}
.brand-text span{font-size:12px;color:var(--ink-soft);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--revenue);}
.dot.off{background:var(--cost);}

.month-nav{display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:8px 6px; box-shadow:var(--shadow);}
.month-nav button{background:none;border:none;color:var(--ink); width:38px;height:38px;border-radius:10px;font-size:18px;display:flex;align-items:center;justify-content:center;}
.month-nav button:hover{background:var(--surface-2);}
.month-nav .label{font-family:'Fraunces',serif; font-weight:600; font-size:15.5px; text-transform:capitalize;}

.tabs{display:flex; gap:6px; margin:14px 0 4px; background:var(--surface-2); padding:4px; border-radius:12px;}
.tab{flex:1; text-align:center; padding:9px 4px; border:none; background:none; border-radius:9px; color:var(--ink-soft); font-weight:600; font-size:13.5px;}
.tab.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}

main{flex:1; padding:14px 16px calc(100px + env(safe-area-inset-bottom,0px));}

/* cards */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; box-shadow:var(--shadow);}
.entry-card{display:flex; gap:12px; align-items:flex-start; cursor:pointer;}
.entry-date{flex-shrink:0; width:46px; text-align:center; background:var(--brand-soft); color:var(--brand); border-radius:10px; padding:6px 0; font-weight:700;}
.entry-date .d{font-size:17px; line-height:1;}
.entry-date .m{font-size:9.5px; text-transform:uppercase; letter-spacing:.03em;}
.entry-body{flex:1; min-width:0;}
.entry-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
.entry-top .name{font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.chip{display:inline-flex; align-items:center; font-size:11px; font-weight:600; padding:2px 8px; border-radius:99px; margin-top:4px;}
.chip.etsy{background:var(--etsy-soft); color:var(--etsy);}
.chip.other{background:var(--info-soft); color:var(--info);}
.entry-nums{display:flex; gap:14px; margin-top:8px; font-size:12.5px; color:var(--ink-soft);}
.entry-nums b{color:var(--ink); font-weight:600;}
.profit-pos{color:var(--profit-pos)!important;}
.profit-neg{color:var(--profit-neg)!important;}

.empty{text-align:center; padding:50px 20px; color:var(--ink-soft);}
.empty .glyph{font-size:34px; margin-bottom:10px;}
.empty h3{margin:0 0 6px; color:var(--ink);}

/* fab */
.fab{position:fixed; right:calc(50% - 320px + 20px); bottom:calc(24px + env(safe-area-inset-bottom,0px)); background:var(--brand); color:var(--brand-ink); border:none; width:56px;height:56px;border-radius:18px; box-shadow:0 8px 24px rgba(139,127,217,.4); font-size:26px; display:flex; align-items:center; justify-content:center; z-index:25;}
@media (max-width:680px){ .fab{right:20px;} }

/* summary grid */
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow);}
.stat .lbl{font-size:12px; color:var(--ink-soft); margin-bottom:4px;}
.stat .val{font-family:'Fraunces',serif; font-size:20px; font-weight:600;}
.stat.cost .val{color:var(--cost);} .stat.revenue .val{color:var(--revenue);}
.stat.profit .val{color:var(--profit-pos);} .stat.profit.neg .val{color:var(--profit-neg);}
.stat.margin .val{color:var(--brand);}

.section-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin:20px 0 10px;}
.chart-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); margin-bottom:14px;}
.chart-card h3{margin:0 0 12px; font-size:14.5px;}
.chart-wrap{position:relative; height:220px;}
.chart-wrap.small{height:200px;}

.legend-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; font-size:12px; color:var(--ink-soft);}
.legend-row span{display:inline-flex; align-items:center; gap:5px;}
.legend-row i{width:9px;height:9px;border-radius:3px;display:inline-block;}

table.stock{width:100%; border-collapse:collapse; font-size:13px;}
table.stock th{text-align:left; color:var(--ink-soft); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; padding:6px 8px; border-bottom:1px solid var(--border);}
table.stock td{padding:9px 8px; border-bottom:1px solid var(--border);}
table.stock tr:last-child td{border-bottom:none;}

.btn{border:none; border-radius:12px; padding:12px 16px; font-weight:600; font-size:14.5px; display:inline-flex; align-items:center; justify-content:center; gap:6px;}
.btn-primary{background:var(--brand); color:var(--brand-ink); width:100%;}
.btn-ghost{background:var(--surface-2); color:var(--ink);}
.btn-danger{background:var(--cost-soft); color:var(--cost);}
.btn-outline{background:none; border:1px solid var(--border); color:var(--ink);}
.btn-block{width:100%;}
.btn-row{display:flex; gap:8px; margin-top:16px;}
.btn-row .btn{flex:1;}

/* product cards */
.prod-card{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.prod-card .info h4{margin:0 0 3px; font-size:15px;}
.prod-card .info span{font-size:12px; color:var(--ink-soft);}
.stock-badge{font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:99px; background:var(--info-soft); color:var(--info); white-space:nowrap;}
.stock-badge.low{background:var(--cost-soft); color:var(--cost);}

/* modal */
.overlay{position:fixed; inset:0; background:rgba(30,25,45,.45); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
.modal{background:var(--bg); width:100%; max-width:640px; max-height:92vh; border-radius:22px 22px 0 0; display:flex; flex-direction:column; overflow:hidden;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0;}
.modal-head h2{margin:0; font-size:17px;}
.modal-head button{background:var(--surface-2); border:none; width:32px;height:32px;border-radius:10px; font-size:16px; color:var(--ink-soft);}
.modal-body{overflow-y:auto; padding:16px 18px calc(24px + env(safe-area-inset-bottom,0px));}
.modal-foot{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--border); background:var(--surface); flex-shrink:0;}

.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:11px; background:var(--surface); color:var(--ink);}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--brand); outline-offset:0; border-color:transparent;}
.field .hint{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.field-toggle{display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:11px 12px; margin-bottom:12px;}
.switch{position:relative; width:40px; height:23px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.slider{position:absolute; inset:0; background:var(--border); border-radius:99px; transition:.15s;}
.slider:before{content:"";position:absolute; width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
input:checked + .slider{background:var(--brand);} input:checked + .slider:before{transform:translateX(17px);}

.subcard{background:var(--surface-2); border-radius:14px; padding:12px; margin-bottom:14px;}
.subcard .row{display:flex; justify-content:space-between; font-size:13px; padding:4px 0; color:var(--ink-soft);}
.subcard .row b{color:var(--ink); font-weight:600;}
.subcard .row.total{border-top:1px dashed var(--border); margin-top:6px; padding-top:8px; font-size:14.5px;}
.subcard .row.total b{font-family:'Fraunces',serif; font-size:16px;}
.suggest-box{display:flex; align-items:center; justify-content:space-between; background:var(--brand-soft); border-radius:12px; padding:10px 12px; margin-bottom:12px;}
.suggest-box div span{display:block; font-size:11px; color:var(--ink-soft);}
.suggest-box div b{font-family:'Fraunces',serif; color:var(--brand); font-size:17px;}
.suggest-box button{background:var(--brand); color:var(--brand-ink); border:none; border-radius:9px; padding:8px 12px; font-size:12.5px; font-weight:700;}

.datalist-wrap{position:relative;}
.autofill-note{font-size:11.5px; color:var(--revenue); margin-top:4px; display:none;}
.autofill-note.show{display:block;}

/* print */
#print-area{display:none;}
@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{display:block; position:absolute; top:0; left:0; width:100%; padding:20px; color:#000;}
  #print-area h1{font-size:20px;margin:0 0 2px;}
  #print-area .sub{font-size:12px;color:#555;margin-bottom:16px;}
  #print-area table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:18px;}
  #print-area th,#print-area td{border:1px solid #ccc;padding:5px 6px;text-align:left;}
  #print-area th{background:#f0f0f0;}
  #print-area .totals td{font-weight:700;background:#fafafa;}
  #print-area .p-stats{display:flex;gap:16px;margin-bottom:16px;}
  #print-area .p-stat{border:1px solid #ccc;border-radius:6px;padding:8px 12px;}
  #print-area .p-stat span{display:block;font-size:10px;color:#666;}
  #print-area .p-stat b{font-size:15px;}
}

.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:99px; font-size:13px; font-weight:600; z-index:80; box-shadow:var(--shadow);}

.btn-add-line{width:100%; background:var(--brand-soft); border:1.5px dashed var(--brand); color:var(--brand); border-radius:11px; padding:10px; font-weight:700; font-size:13px; margin-bottom:10px; text-align:center;}
.line-item{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.line-item select, .line-item input{flex:1 1 auto; min-width:0; padding:9px 10px; border:1px solid var(--border); border-radius:9px; background:var(--surface); color:var(--ink); font-size:13.5px;}
.line-item input[data-field="gramas"], .line-item input[data-field="valor"]{flex:0 0 84px;}
.line-remove{flex:0 0 auto; width:32px; height:32px; border-radius:9px; border:none; background:var(--cost-soft); color:var(--cost); font-size:15px;}
.cat-total{display:flex; justify-content:space-between; align-items:center; background:var(--surface-2); border-radius:10px; padding:9px 12px; font-size:13px; margin:2px 0 16px; font-weight:600;}
.cat-total b{font-family:'Fraunces',serif; font-size:15px;}
.warn-banner{background:var(--cost-soft); color:var(--cost); font-size:12.5px; font-weight:600; padding:10px 12px; border-radius:12px; margin-bottom:12px;}
.version-tag{font-size:9px; color:var(--ink-soft); opacity:.55; letter-spacing:.02em;}
.line-total{flex:0 0 64px; font-size:12.5px; font-weight:700; color:var(--ink); text-align:right;}
.chip-list{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;}
.chip-item{display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:8px 14px; font-size:13px; box-shadow:var(--shadow);}
.chip-item b{color:var(--brand); font-weight:700;}
</style>
</head>

<script>
const APP_VERSION = 'v1-github-firebase';
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB_TmUQN_JQwYh-QQzdmehMhqe1Apnqwv8",
  authDomain: "calculadora3d-5d2db.firebaseapp.com",
  projectId: "calculadora3d-5d2db",
  storageBucket: "calculadora3d-5d2db.firebasestorage.app",
  messagingSenderId: "40753148792",
  appId: "1:40753148792:web:8b900e70fbdbcb3eea8e8d"
};
/* ---------- constantes de negócio (somente Etsy) ---------- */
const ETSY_TRANSACTION_RATE = 0.065;
const ETSY_PROCESSING_RATE = 0.03;
const ETSY_PROCESSING_FIXED = 0.25;
const FILAMENT_PRESETS = ['PLA','PLA+','PLA Silk','PLA Matte (Fosco)','PLA Brilhante','PLA Wood (Madeira)','PLA Marble (Mármore)','PETG','ABS','ASA','TPU (Flexível)','Nylon','Resina'];
const OP_ITEM_PRESETS = ['Caixa de papelão','Plástico bolha','Fita adesiva','Saco plástico / Embalagem','Etiqueta de envio','Cartão de agradecimento','Papel picado'];
const EXTRA_ITEM_PRESETS = ['Sílica Gel','Brinde','Cartão personalizado','Adesivo'];
const CARRIER_PRESETS = ['Correios','Jadlog','Loggi','Mercado Envios','Shopee Envios','USPS','UPS','FedEx','DHL'];

function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function fmt(v){ return (v<0?'-':'') + '$' + Math.abs(v).toFixed(2); }
function pct(v){ return (v*100).toFixed(1) + '%'; }
function uid(){ return Math.random().toString(36).slice(2,10); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function monthOf(dateStr){ return (dateStr||todayStr()).slice(0,7); }
function currentMonthStr(){ return todayStr().slice(0,7); }
function monthLabel(m){
  const [y,mo] = m.split('-').map(Number);
  const d = new Date(y, mo-1, 1);
  return d.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
}
function shiftMonth(m, delta){
  let [y,mo] = m.split('-').map(Number);
  mo += delta;
  if(mo<1){mo=12;y--;} if(mo>12){mo=1;y++;}
  return y+'-'+String(mo).padStart(2,'0');
}
function dayLabel(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return {d: String(d.getDate()).padStart(2,'0'), m: d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')};
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- histórico: nomes conhecidos e último valor usado ---------- */
function distinctNames(arrKey, presets){
  const names = new Set(presets);
  state.entries.forEach(e=> (e[arrKey]||[]).forEach(r=> { if(r.nome) names.add(r.nome); }));
  return Array.from(names);
}
function lastUsedRow(arrKey, nome){
  nome = (nome||'').trim().toLowerCase();
  if(!nome) return null;
  for(const e of state.entries){
    const row = (e[arrKey]||[]).find(r=> r.nome && r.nome.trim().toLowerCase()===nome);
    if(row) return row;
  }
  return null;
}

/* ---------- etsy ---------- */
function calcEtsyFees(precoVenda, qtd){
  const orderTotal = precoVenda*qtd;
  const transacao = orderTotal * ETSY_TRANSACTION_RATE;
  const processamento = orderTotal * ETSY_PROCESSING_RATE + ETSY_PROCESSING_FIXED;
  return {transacao, processamento, total: transacao+processamento};
}
function suggestedPrice(custosFixos, qtd, markup){
  const q = qtd||1;
  const denom = q * (1 - ETSY_TRANSACTION_RATE - ETSY_PROCESSING_RATE);
  if(denom<=0) return null;
  return (custosFixos*(1+markup) + ETSY_PROCESSING_FIXED) / denom;
}
function suggestedPriceSemTaxa(custosFixos, qtd, markup){
  return (custosFixos*(1+markup)) / (qtd||1);
}

/* ---------- linhas de custo: total de cada linha ---------- */
function rowTotal(arr, row){
  if(arr==='filamentos') return (num(row.precoKg)/1000) * num(row.gramas);
  return num(row.qtd) * num(row.precoUnit);
}

/* ---------- lançamento: soma os itens digitados nesta entrada ---------- */
function computeEntry(d){
  const isEtsy = d.marketplace!=='particular';
  const custoFilamentoTotal = (d.filamentos||[]).reduce((s,r)=> s + rowTotal('filamentos',r), 0);
  const horasTotal = num(d.horasImpressao) + num(d.minutosImpressao)/60;
  const custoEnergiaTotal = horasTotal * num(d.custoEnergiaPorHora);
  const custoOperacionalTotal = (d.itensOperacionais||[]).reduce((s,r)=> s + rowTotal('itensOperacionais',r), 0);
  const custoExtraTotal = (d.itensExtras||[]).reduce((s,r)=> s + rowTotal('itensExtras',r), 0);
  const custoEnvioTotal = (d.envios||[]).reduce((s,r)=> s + rowTotal('envios',r), 0);
  const custoProducaoTotal = custoFilamentoTotal + custoEnergiaTotal + custoOperacionalTotal + custoExtraTotal;
  const qtdProduzida = Math.max(num(d.quantidadeProduzida),0);
  const qtdVendida = Math.max(num(d.quantidadeVendida),0);
  const preco = num(d.precoVenda);
  const taxaListagem = isEtsy ? num(d.taxaListagem) : 0;
  const fees = isEtsy ? calcEtsyFees(preco, qtdVendida) : {transacao:0, processamento:0, total:0};
  const custoAds = d.usouAds ? num(d.custoAds) : 0;
  const custoVendaTotal = custoEnvioTotal + taxaListagem + fees.total + custoAds;
  const custoTotal = custoProducaoTotal + custoVendaTotal;
  const faturamento = preco * qtdVendida;
  const lucroLiquido = faturamento - custoTotal;
  const margemRealizada = faturamento>0 ? lucroLiquido/faturamento : 0;
  const custosFixosSugestao = custoProducaoTotal + custoEnvioTotal + taxaListagem + custoAds;
  const precoSugerido = isEtsy
    ? suggestedPrice(custosFixosSugestao, qtdVendida||1, num(d.margemAlvo)/100)
    : suggestedPriceSemTaxa(custosFixosSugestao, qtdVendida||1, num(d.margemAlvo)/100);
  return {
    isEtsy, horasTotal, custoFilamentoTotal, custoEnergiaTotal, custoOperacionalTotal, custoExtraTotal, custoEnvioTotal,
    custoProducaoTotal, custoVendaTotal, custoAds, fees, custoTotal, faturamento, lucroLiquido, margemRealizada,
    precoSugerido, qtdProduzida, qtdVendida,
  };
}

/* ---------- catálogo simples: só "Produtos" continua sendo um cadastro de verdade ---------- */
const CATALOG_CONFIG = {
  products: {collection:'products', label:'Produto', plural:'Produtos cadastrados', valueLabel:'Preço de venda padrão ($, opcional)', placeholder:'Ex: Coelho articulado P'},
};
function ensureCatalogItem(key, nome, valor){
  nome = (nome||'').trim();
  if(!nome) return null;
  const list = state[key];
  const existing = list.find(x=>x.nome.trim().toLowerCase()===nome.toLowerCase());
  if(existing) return existing;
  const item = {id: uid(), nome, valor: valor||''};
  list.push(item);
  list.sort((a,b)=>a.nome.localeCompare(b.nome));
  saveDoc(CATALOG_CONFIG[key].collection, item.id, {nome:item.nome, valor:item.valor});
  return item;
}

/* ---------- persistência (Firebase) ---------- */
function collRef(name){ return state.db.collection('cw3dFin').doc('data').collection(name); }
function rootDoc(){ return state.db.collection('cw3dFin').doc('data'); }

async function initDb(){
  try{
    const app = firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();
    await new Promise((resolve, reject)=>{
      const unsub = auth.onAuthStateChanged(user=>{
        if(user){ unsub(); resolve(user); }
      }, reject);
      auth.signInAnonymously().catch(reject);
    });
    state.db = firebase.firestore();
    state.dbOk = true;
  }catch(e){ state.dbOk = false; console.error('Firebase init falhou:', e); }
  await loadAll();
  state.loaded = true;
  render();
}
async function loadAll(){
  if(!state.db){ return; }
  try{
    const [prodSnap, entrySnap, setSnap] = await Promise.all([
      collRef('products').orderBy('nome').get(),
      collRef('entries').orderBy('data','desc').limit(2000).get(),
      rootDoc().get(),
    ]);
    state.products = prodSnap.docs.map(d=>({id:d.id, ...d.data()}));
    state.entries = entrySnap.docs.map(d=>({id:d.id, ...d.data()}));
    if(setSnap.exists) state.settings = {...state.settings, ...setSnap.data()};
  }catch(e){ console.error('Falha ao carregar dados:', e); }
}
async function saveDoc(collection, id, data){
  if(!state.db) return id || uid();
  if(id){ await collRef(collection).doc(id).set(data); return id; }
  const ref = await collRef(collection).add(data);
  return ref.id;
}
async function deleteDoc(collection, id){ if(state.db) await collRef(collection).doc(id).delete(); }
async function saveEntryDoc(id, data){ return saveDoc('entries', id, data); }
async function deleteEntryDoc(id){ return deleteDoc('entries', id); }
async function saveSettingsDoc(data){ if(state.db) await rootDoc().set(data, {merge:true}); }

/* ---------- ações ---------- */
function openEntryModal(entry){
  const key = draftKey('entry', entry?entry.id:null);
  let draft = state.draftCache[key];
  if(!draft){ draft = entry ? {...entry} : emptyEntry(); state.draftCache[key] = draft; }
  state.modal = {type:'entry', id: entry ? entry.id : null, draft};
  render();
}
function openSimpleModal(catalogKey, item){
  const type = 'simple:'+catalogKey;
  const key = draftKey(type, item?item.id:null);
  let draft = state.draftCache[key];
  if(!draft){ draft = item ? {...item} : {nome:'', valor:''}; state.draftCache[key] = draft; }
  state.modal = {type, catalogKey, id: item ? item.id : null, draft};
  render();
}
function closeModal(){ state.modal = null; state.pendingReturn = null; render(); }

async function submitEntry(){
  const d = state.modal.draft;
  if(!d.produtoNome.trim()){ toast('Digite o produto'); return; }
  if(!d.data){ toast('Escolha a data'); return; }
  ensureCatalogItem('products', d.produtoNome, '');
  if(d.custoEnergiaPorHora){ state.settings.custoEnergiaPorHora = d.custoEnergiaPorHora; saveSettingsDoc(state.settings); }
  const computed = computeEntry(d);
  const payload = {
    ...d, mes: monthOf(d.data),
    custoFilamentoTotal: computed.custoFilamentoTotal, custoEnergiaTotal: computed.custoEnergiaTotal,
    custoOperacionalTotal: computed.custoOperacionalTotal, custoExtraTotal: computed.custoExtraTotal,
    custoEnvioTotal: computed.custoEnvioTotal, custoProducaoTotal: computed.custoProducaoTotal,
    custoVendaTotal: computed.custoVendaTotal, taxaMarketplaceCalculada: computed.fees.total,
    custoTotal: computed.custoTotal, faturamento: computed.faturamento, lucroLiquido: computed.lucroLiquido,
    margemRealizada: computed.margemRealizada, atualizadoEm: new Date().toISOString(),
  };
  const id = await saveEntryDoc(state.modal.id, payload);
  const idx = state.entries.findIndex(e=>e.id===id);
  const full = {id, ...payload};
  if(idx>=0) state.entries[idx] = full; else state.entries.unshift(full);
  state.month = payload.mes;
  delete state.draftCache[draftKey('entry', state.modal.id)];
  closeModal();
  toast('Lançamento salvo');
}
async function removeEntry(id){
  if(!confirm('Excluir este lançamento?')) return;
  await deleteEntryDoc(id);
  state.entries = state.entries.filter(e=>e.id!==id);
  closeModal();
  toast('Lançamento excluído');
}
async function submitSimple(){
  const key = state.modal.catalogKey;
  const cfg = CATALOG_CONFIG[key];
  const d = state.modal.draft;
  if(!d.nome.trim()){ toast('Digite um nome'); return; }
  const id = await saveDoc(cfg.collection, state.modal.id, d);
  const idx = state[key].findIndex(x=>x.id===id);
  const full = {id, ...d};
  if(idx>=0) state[key][idx]=full; else state[key].push(full);
  state[key].sort((a,b)=>a.nome.localeCompare(b.nome));
  delete state.draftCache[draftKey('simple:'+key, state.modal.id)];
  closeModal();
  toast(cfg.label+' salvo');
}
async function removeSimple(key, id){
  if(!confirm('Excluir? Lançamentos já salvos não serão afetados.')) return;
  await deleteDoc(CATALOG_CONFIG[key].collection, id);
  state[key] = state[key].filter(x=>x.id!==id);
  closeModal();
  toast('Excluído');
}

let toastTimer;
function toast(msg){
  clearTimeout(toastTimer);
  let el = document.getElementById('toast');
  if(!el){ el = document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg; el.style.display='block';
  toastTimer = setTimeout(()=>{ el.style.display='none'; }, 2200);
}

/* ---------- agregações ---------- */
function entriesForMonth(m){ return state.entries.filter(e=>e.mes===m); }
function aggregateMonth(m){
  const es = entriesForMonth(m);
  const totals = {custoTotal:0, faturamento:0, lucroLiquido:0, filamento:0, energia:0, operacional:0, extra:0, envio:0, etsyFee:0, listagem:0, ads:0};
  es.forEach(e=>{
    totals.custoTotal += num(e.custoTotal); totals.faturamento += num(e.faturamento); totals.lucroLiquido += num(e.lucroLiquido);
    totals.filamento += num(e.custoFilamentoTotal); totals.energia += num(e.custoEnergiaTotal);
    totals.operacional += num(e.custoOperacionalTotal); totals.extra += num(e.custoExtraTotal);
    totals.envio += num(e.custoEnvioTotal); totals.listagem += num(e.taxaListagem);
    totals.etsyFee += num(e.taxaMarketplaceCalculada); totals.ads += (e.usouAds?num(e.custoAds):0);
  });
  totals.margem = totals.faturamento>0 ? totals.lucroLiquido/totals.faturamento : 0;
  const byDay = {};
  es.forEach(e=>{ const k=e.data; byDay[k] = byDay[k] || {custo:0, faturamento:0, lucro:0};
    byDay[k].custo += num(e.custoTotal); byDay[k].faturamento += num(e.faturamento); byDay[k].lucro += num(e.lucroLiquido); });
  const days = Object.keys(byDay).sort();
  return {es, totals, days, byDay};
}
function aggregateStock(){
  const map = {};
  state.entries.forEach(e=>{
    const key = e.produtoNome || '(sem nome)';
    map[key] = map[key] || {produzida:0, vendida:0};
    map[key].produzida += num(e.quantidadeProduzida);
    map[key].vendida += num(e.quantidadeVendida);
  });
  return Object.entries(map).map(([nome,v])=>({nome, produzida:v.produzida, vendida:v.vendida, estoque:v.produzida-v.vendida}))
    .sort((a,b)=>a.nome.localeCompare(b.nome));
}

function renderCharts(){
  const {totals, days, byDay} = aggregateMonth(state.month);
  Object.values(state.charts).forEach(c=>c && c.destroy());
  if(typeof Chart === 'undefined'){
    const msg = '<div style="text-align:center;color:var(--ink-soft);font-size:12px;padding:30px 10px;">Gráfico indisponível (a biblioteca de gráficos não carregou). Verifique sua conexão e recarregue a página.</div>';
    const tWrap = document.getElementById('chart-trend'), cWrap = document.getElementById('chart-costs');
    if(tWrap && tWrap.parentElement) tWrap.parentElement.innerHTML = msg;
    if(cWrap && cWrap.parentElement) cWrap.parentElement.innerHTML = msg;
    return;
  }
  const ctxTrend = document.getElementById('chart-trend');
  if(ctxTrend){
    if(days.length===0){
      ctxTrend.parentElement.innerHTML = '<div style="text-align:center;color:var(--ink-soft);font-size:12px;padding:30px 10px;">Sem lançamentos neste mês ainda.</div>';
    } else {
      try{
        const labels = days.map(d=>dayLabel(d).d);
        state.charts.trend = new Chart(ctxTrend, {
          type:'bar',
          data:{ labels, datasets:[
            {label:'Faturamento', data: days.map(d=>byDay[d].faturamento), backgroundColor:'#5FA98A', borderRadius:4},
            {label:'Custo', data: days.map(d=>byDay[d].custo), backgroundColor:'#DD8C7A', borderRadius:4},
            {label:'Lucro', type:'line', data: days.map(d=>byDay[d].lucro), borderColor:'#8B7FD9', backgroundColor:'#8B7FD9', tension:.3, pointRadius:3},
          ]},
          options:{ responsive:true, maintainAspectRatio:false,
            plugins:{ legend:{ position:'bottom', labels:{ color:getInk(), boxWidth:10, font:{size:11} } } },
            scales:{ x:{ ticks:{color:getInkSoft()}, grid:{display:false} }, y:{ ticks:{color:getInkSoft(), callback:v=>'$'+v}, grid:{color:getBorder()} } } }
        });
      }catch(err){
        ctxTrend.parentElement.innerHTML = '<div style="text-align:center;color:var(--cost);font-size:11px;padding:20px 10px;">Erro ao desenhar o gráfico: '+escapeHtml(String(err&&err.message||err))+'</div>';
      }

  }
  const ctxCosts = document.getElementById('chart-costs');
  if(ctxCosts){
    const parts = [
      {l:'Filamento', v:totals.filamento, c:'#8B7FD9'},
      {l:'Energia', v:totals.energia, c:'#6FA3C0'},
      {l:'Operacional', v:totals.operacional, c:'#B79CE0'},
      {l:'Extras', v:totals.extra, c:'#C9A6E0'},
      {l:'Envio', v:totals.envio, c:'#DD8C7A'},
      {l:'Taxa Etsy', v:totals.etsyFee, c:'#E8A25C'},
      {l:'Listagem', v:totals.listagem, c:'#E8C25C'},
      {l:'Ads', v:totals.ads, c:'#D2645B'},

      ctxCosts.parentElement.innerHTML = '<div style="text-align:center;color:var(--ink-soft);font-size:12px;padding:30px 10px;">Sem custos lançados neste mês ainda.</div>';
    } else {
      try{
        state.charts.costs = new Chart(ctxCosts, {
          type:'doughnut',
          data:{ labels:parts.map(p=>p.l), datasets:[{data:parts.map(p=>p.v), backgroundColor:parts.map(p=>p.c), borderWidth:0}] },
          options:{ responsive:true, maintainAspectRatio:false, cutout:'62%',

function allDatalists(){
  return `
    <datalist id="dl-filamentos">${nameOptionsHtml('filamentos', FILAMENT_PRESETS)}</datalist>
    <datalist id="dl-itensOperacionais">${nameOptionsHtml('itensOperacionais', OP_ITEM_PRESETS)}</datalist>
    <datalist id="dl-itensExtras">${nameOptionsHtml('itensExtras', EXTRA_ITEM_PRESETS)}</datalist>
    <datalist id="dl-envios">${nameOptionsHtml('envios', CARRIER_PRESETS)}</datalist>
  `;
}

  return `
  <div class="overlay">
    <div class="modal" data-stop>

      <div class="modal-body">
        ${allDatalists()}
        <div class="field"><label>Data</label><input type="date" name="data" value="${d.data}"></div>
        <div class="field">
          <label>Produto</label>
          <input type="text" name="produtoNome" list="dl-produtos" value="${escapeHtml(d.produtoNome)}" placeholder="Digite ou escolha um produto" autocomplete="off">

        <div class="field-row">
          <div class="field"><label>Tempo (horas)</label><input type="number" step="1" min="0" name="horasImpressao" value="${d.horasImpressao}" placeholder="0"></div>
          <div class="field"><label>Tempo (min)</label><input type="number" step="1" min="0" max="59" name="minutosImpressao" value="${d.minutosImpressao}" placeholder="0"></div>

        <div class="cat-total"><span>Custo de energia</span><b id="calc-energia">${fmt(computed.custoEnergiaTotal)}</b></div>

        <div class="section-title">⚙️ Filamento</div>
        <div id="rows-filamentos">${(d.filamentos||[]).map((r,i)=>lineItemRow('filamentos',i,r)).join('')}</div>
        <button type="button" class="btn-add-line" data-act="add-row" data-arr="filamentos">+ Adicionar filamento</button>
        <div class="cat-total"><span>Total de material</span><b id="calc-filamento">${fmt(computed.custoFilamentoTotal)}</b></div>

        <div class="section-title">💳 Custos Operacionais</div>
        <div id="rows-itensOperacionais">${(d.itensOperacionais||[]).map((r,i)=>lineItemRow('itensOperacionais',i,r)).join('')}</div>
        <button type="button" class="btn-add-line" data-act="add-row" data-arr="itensOperacionais">+ Adicionar item</button>
        <div class="cat-total"><span>Total custos operacionais</span><b id="calc-operacional">${fmt(computed.custoOperacionalTotal)}</b></div>

        <div class="section-title">🏷️ Custos Extras</div>
        <div id="rows-itensExtras">${(d.itensExtras||[]).map((r,i)=>lineItemRow('itensExtras',i,r)).join('')}</div>
        <button type="button" class="btn-add-line" data-act="add-row" data-arr="itensExtras">+ Adicionar item</button>
        <div class="cat-total"><span>Total custos extras</span><b id="calc-extra">${fmt(computed.custoExtraTotal)}</b></div>

        <div class="section-title">🚚 Taxas de Envio</div>
        <div id="rows-envios">${(d.envios||[]).map((r,i)=>lineItemRow('envios',i,r)).join('')}</div>
        <button type="button" class="btn-add-line" data-act="add-row" data-arr="envios">+ Adicionar transportadora</button>
        <div class="cat-total"><span>Total de envios</span><b id="calc-envio">${fmt(computed.custoEnvioTotal)}</b></div>

        <div class="section-title">🏛️ Canal de Venda</div>
        <div class="field"><label>Onde foi essa venda?</label>
          <select name="marketplace">
            <option value="etsy" ${computed.isEtsy?'selected':''}>Etsy</option>
            <option value="particular" ${!computed.isEtsy?'selected':''}>Venda particular / direta</option>

        ${computed.isEtsy ? `
        <div class="field"><label>Taxa de listagem ($)</label><input type="number" step="0.01" name="taxaListagem" value="${d.taxaListagem}" placeholder="Ex: 0,20"><div class="hint">Etsy cobra US$ 0,20 por item anunciado.</div></div>
        <div class="hint" style="margin:-4px 0 10px;">
          Calculado automaticamente: <b>Taxa de transação</b> 6,5% sobre o preço de venda, mais <b>processamento</b> (tarifa dos EUA) de 3% + US$ 0,25. Como você não cobra frete à parte, incide só sobre o preço de venda.

        ${d.usouAds ? `<div class="field"><label>Custo de Ads ($)</label><input type="number" step="0.01" name="custoAds" value="${d.custoAds}"></div>` : ''}

        <div class="section-title">📋 Registro de Produção</div>

        <div class="suggest-box">
          <div><span>Preço de venda sugerido</span><b id="suggest-value">${computed.precoSugerido!==null ? fmt(computed.precoSugerido) : '—'}</b></div>
          <button type="button" data-act="use-suggested" id="use-suggested-btn" style="${computed.precoSugerido!==null?'':'display:none;'}">Usar</button>
        </div>
        <div class="field"><label>Preço de venda (por unidade)</label><input type="number" step="0.01" name="precoVenda" value="${d.precoVenda}"></div>

        <div class="subcard">
          <div class="row"><span>Faturamento bruto</span><b id="calc-revenue">${fmt(computed.faturamento)}</b></div>
          <div class="row"><span>Custos totais</span><b id="calc-total">${fmt(computed.custoTotal)}</b></div>
          <div class="row total"><span>Lucro líquido</span><b id="calc-profit" class="${computed.lucroLiquido>=0?'profit-pos':'profit-neg'}">${fmt(computed.lucroLiquido)} (${pct(computed.margemRealizada)})</b></div>
        </div>

        <div class="field"><label>Observações</label><textarea name="observacoes" rows="2" placeholder="Ex: cliente pediu embrulho de presente, atraso no envio…">${escapeHtml(d.observacoes||'')}</textarea><div class="hint">Anotação livre, não entra em nenhum cálculo.</div></div>

        ${m.id ? `<button class="btn btn-danger btn-block" data-act="delete-entry" data-id="${m.id}">Excluir lançamento</button>` : ''}
      </div>
      <div class="modal-foot"><button class="btn btn-primary btn-block" data-act="save-entry">Salvar lançamento</button></div>
    </div>
  </div>`;
}

function renderSimpleModal(m){
  const cfg = CATALOG_CONFIG[m.catalogKey];
  const d = m.draft;
  return `
  <div class="overlay">
    <div class="modal" data-stop>
      <div class="modal-head"><h2>${m.id?'Editar':'Novo'} ${cfg.label.toLowerCase()}</h2><button data-act="close">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>Nome</label><input type="text" name="nome" value="${escapeHtml(d.nome)}" placeholder="${cfg.placeholder}"></div>
        <div class="field"><label>${cfg.valueLabel}</label><input type="number" step="0.01" name="valor" value="${d.valor}" placeholder="Digite o valor"></div>
        ${m.id ? `<button class="btn btn-danger btn-block" data-act="delete-simple" data-key="${m.catalogKey}" data-id="${m.id}">Excluir</button>` : ''}
      </div>
      <div class="modal-foot"><button class="btn btn-primary btn-block" data-act="save-simple">Salvar</button></div>
    </div>
  </div>`;
}

/* ---------- impressão ---------- */
function printMonth(){
  const {es, totals} = aggregateMonth(state.month);
  const rows = es.slice().sort((a,b)=> a.data<b.data?-1:1).map(e=>`
    <tr><td>${e.data.split('-').reverse().join('/')}</td><td>${escapeHtml(e.produtoNome)}</td>
    <td>${e.quantidadeProduzida}</td><td>${e.quantidadeVendida}</td><td>${fmt(num(e.precoVenda))}</td>
    <td>${fmt(num(e.custoTotal))}</td><td>${fmt(num(e.faturamento))}</td><td>${fmt(num(e.lucroLiquido))}</td></tr>`).join('');
  const stock = aggregateStock();
  const stockRows = stock.map(s=>`<tr><td>${escapeHtml(s.nome)}</td><td>${s.produzida}</td><td>${s.vendida}</td><td>${s.estoque}</td></tr>`).join('');
  document.getElementById('print-area').innerHTML = `
    <h1>Creative Works 3D — Controle Financeiro</h1>
    <div class="sub">${monthLabel(state.month)}</div>
    <div class="p-stats">
      <div class="p-stat"><span>Total gasto</span><b>${fmt(totals.custoTotal)}</b></div>
      <div class="p-stat"><span>Faturamento</span><b>${fmt(totals.faturamento)}</b></div>
      <div class="p-stat"><span>Lucro líquido</span><b>${fmt(totals.lucroLiquido)}</b></div>
      <div class="p-stat"><span>Margem</span><b>${pct(totals.margem)}</b></div>
    </div>
    <table>
      <thead><tr><th>Data</th><th>Produto</th><th>Produzido</th><th>Vendido</th><th>Preço</th><th>Custo total</th><th>Faturamento</th><th>Lucro</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr class="totals"><td colspan="5">Totais do mês</td><td>${fmt(totals.custoTotal)}</td><td>${fmt(totals.faturamento)}</td><td>${fmt(totals.lucroLiquido)}</td></tr></tfoot>
    </table>
    <h1 style="font-size:16px;">Estoque (histórico completo)</h1>
    <table><thead><tr><th>Produto</th><th>Produzido</th><th>Vendido</th><th>Em estoque</th></tr></thead><tbody>${stockRows}</tbody></table>
  `;
  window.print();
}

/* ---------- eventos ---------- */
function bindEvents(){
  const app = document.getElementById('app');
  app.onclick = (ev)=>{
    const el = ev.target.closest('[data-act]');
    if(!el) return;
    const act = el.dataset.act;
    if(act==='prev-month'){ state.month = shiftMonth(state.month,-1); render(); }
    else if(act==='next-month'){ state.month = shiftMonth(state.month,1); render(); }
    else if(act==='tab'){ state.tab = el.dataset.tab; render(); }
    else if(act==='new-entry'){ openEntryModal(null); }
    else if(act==='new-simple'){ openSimpleModal(el.dataset.key, null); }
    else if(act==='edit-entry'){ const e=state.entries.find(x=>x.id===el.dataset.id); openEntryModal(e); }
    else if(act==='edit-simple'){ const key=el.dataset.key; const it=state[key].find(x=>x.id===el.dataset.id); openSimpleModal(key, it); }
    else if(act==='delete-entry'){ removeEntry(el.dataset.id); }
    else if(act==='delete-simple'){ removeSimple(el.dataset.key, el.dataset.id); }
    else if(act==='close'){ closeModal(); }
    else if(act==='save-entry'){ submitEntry(); }
    else if(act==='save-simple'){ submitSimple(); }
    else if(act==='print-month'){ printMonth(); }
    else if(act==='add-row'){
      const arr = el.dataset.arr;
      const list = state.modal.draft[arr] || (state.modal.draft[arr]=[]);
      list.push(emptyRow(arr));
      renderModalOnly();
    }
    else if(act==='remove-row'){
      const arr = el.dataset.arr, idx = Number(el.dataset.idx);
      state.modal.draft[arr].splice(idx,1);
      renderModalOnly();
    }
    else if(act==='use-suggested'){
      const computed = computeEntry(state.modal.draft);
      if(computed.precoSugerido!==null){
        state.modal.draft.precoVenda = computed.precoSugerido.toFixed(2);
        const priceInput = app.querySelector('[name="precoVenda"]');
        if(priceInput) priceInput.value = state.modal.draft.precoVenda;
        updateComputedPreview();
      }
    }
  };
  const modalEl = app.querySelector('.modal');
  if(modalEl){
    modalEl.addEventListener('input', (ev)=>{
      const inp = ev.target;
      if(inp.dataset.arr){
        const arr = state.modal.draft[inp.dataset.arr];
        const idx = Number(inp.dataset.idx);
        if(!arr || !arr[idx]) return;
        arr[idx][inp.dataset.field] = inp.value;
        const totalEl = document.getElementById('row-total-'+inp.dataset.arr+'-'+idx);
        if(totalEl) totalEl.textContent = fmt(rowTotal(inp.dataset.arr, arr[idx]));
        updateComputedPreview();
        return;
      }
      if(!inp.name) return;
      state.modal.draft[inp.name] = inp.type==='checkbox' ? inp.checked : inp.value;
      if(inp.name==='usouAds' || inp.name==='marketplace') return;
      updateComputedPreview();
    });
    modalEl.addEventListener('change', (ev)=>{
      const inp = ev.target;
      if(inp.dataset.arr){
        const arr = state.modal.draft[inp.dataset.arr];
        const idx = Number(inp.dataset.idx);
        if(!arr || !arr[idx]) return;
        arr[idx][inp.dataset.field] = inp.value;
        if(inp.dataset.field==='nome'){
          const last = lastUsedRow(inp.dataset.arr, inp.value);
          if(last){
            if(inp.dataset.arr==='filamentos'){ if(!arr[idx].precoKg) arr[idx].precoKg = last.precoKg; }
            else { if(!arr[idx].precoUnit) arr[idx].precoUnit = last.precoUnit; }
          }
          renderModalOnly();
        }
        return;
      }
      if(!inp.name) return;
      state.modal.draft[inp.name] = inp.type==='checkbox' ? inp.checked : inp.value;
      if(inp.name==='produtoNome'){
        const existing = state.products.find(p=>p.nome.trim().toLowerCase()===inp.value.trim().toLowerCase());
        if(existing && existing.valor && !state.modal.draft.precoVenda){ state.modal.draft.precoVenda = existing.valor; }
      }
      if(inp.name==='usouAds' || inp.name==='marketplace'){ renderModalOnly(); }
    });
  }
}
function updateComputedPreview(){
  if(!state.modal || state.modal.type!=='entry') return;
  const computed = computeEntry(state.modal.draft);
  const set = (id, html)=>{ const el=document.getElementById(id); if(el) el.innerHTML = html; };
  set('calc-energia', fmt(computed.custoEnergiaTotal));
  set('calc-filamento', fmt(computed.custoFilamentoTotal));
  set('calc-operacional', fmt(computed.custoOperacionalTotal));
  set('calc-extra', fmt(computed.custoExtraTotal));
  set('calc-envio', fmt(computed.custoEnvioTotal));
  set('calc-fee-transacao', fmt(computed.fees.transacao));
  set('calc-fee-processamento', fmt(computed.fees.processamento));
  set('calc-revenue', fmt(computed.faturamento));
  set('calc-total', fmt(computed.custoTotal));
  set('calc-profit', fmt(computed.lucroLiquido) + ' (' + pct(computed.margemRealizada) + ')');
  const profitEl = document.getElementById('calc-profit');
  if(profitEl) profitEl.className = computed.lucroLiquido>=0 ? 'profit-pos' : 'profit-neg';
  set('suggest-value', computed.precoSugerido!==null ? fmt(computed.precoSugerido) : '—');
  const btn = document.getElementById('use-suggested-btn');
  if(btn) btn.style.display = computed.precoSugerido!==null ? '' : 'none';
  const markup = num(state.modal.draft.margemAlvo);
  set('markup-to-margin', markup>0 ? `Equivale a ${(markup/(100+markup)*100).toFixed(1)}% de margem sobre a venda.` : '');
}
function renderModalOnly(){
  const app = document.getElementById('app');
  const existing = app.querySelector('.overlay');
  if(!existing) return;
  const wrap = document.createElement('div');
  wrap.innerHTML = renderModal();
  app.replaceChild(wrap.firstElementChild, existing);
  bindEvents();
}

/* ---------- start ---------- */
initDb();
</script>
